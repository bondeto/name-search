openapi: 3.0.3
info:
  title: Enterprise Identity Resolution & Screening API
  description: API Spesifikasi Layanan Pencarian & Screening Identity Matcher untuk Enterprise, FinTech, E-Commerce, dan Anti-Fraud Compliance.
  version: 1.0.0
paths:
  /v1/screen:
    post:
      summary: Screening Identitas & Watchlist Lookup
      description: Membandingkan identitas target terhadap basis data dengan kalkulasi skor probabilistik dan generasi audit trail terenkripsi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - operator_id
                - system_module
              properties:
                full_name:
                  type: string
                  example: "MOHAMMED ALY KHAN"
                dob:
                  type: string
                  example: "1982-14-05"
                identity_number:
                  type: string
                  example: "3171011505850001"
                passport_no:
                  type: string
                  example: "A12345678"
                operator_id:
                  type: string
                  example: "OPERATOR_9981"
                system_module:
                  type: string
                  example: "SCREENING_MODULE"
      responses:
        '200':
          description: Hasil Screening Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  match_found:
                    type: boolean
                  status:
                    type: string
                    example: "CRITICAL MATCH (RED)"
                  results:
                    type: array
                    items:
                      type: object
                  audit_log:
                    type: object
                    properties:
                      log_id:
                        type: string
                      integrity_hash:
                        type: string
  /v1/validate-id:
    post:
      summary: Validasi & Parser National ID
      description: Ekstraksi struktur 16 digit Nomor Identitas Nasional untuk verifikasi Tanggal Lahir, Jenis Kelamin, dan Kode Wilayah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity_number
              properties:
                identity_number:
                  type: string
                  example: "3171011505850001"
      responses:
        '200':
          description: Hasil Validasi Identitas
